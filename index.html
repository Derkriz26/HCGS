<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielerin des Spiels - Zweite Wahl - Beste Wahl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #121212;
            color: #f1f5f9;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .glass-card {
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent !important;
            user-select: none;
            cursor: pointer;
        }
        .glass-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .glass-card.flash-active {
            background: rgba(255, 255, 255, 0.12) !important;
        }
        button {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="p-3 md:p-5 flex flex-col justify-between select-none">

    <!-- Header -->
    <header class="text-center py-1 flex-shrink-0">
        <div class="flex items-center justify-between mb-1">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-red-500/10 border border-red-500/20 text-red-400 text-[10px] font-semibold uppercase tracking-wider">
                <svg class="w-2.5 h-2.5 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.683-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1.001 1.001 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                Zweite Wahl - Beste Wahl
            </div>
            
            <button onclick="showResults()" class="px-3 py-1 bg-red-600 hover:bg-red-500 text-white text-[11px] font-semibold rounded-lg shadow-md shadow-red-600/30 transition-all flex items-center gap-1.5">
                <span>Ergebnis</span>
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            </button>
        </div>
        
        <h1 class="text-base md:text-lg font-bold tracking-tight text-white" id="main-title">Spielerin des Spiels</h1>
        <p class="text-zinc-400 text-[11px]" id="vote-counter-label">Bereits <span id="total-votes-count" class="text-amber-400 font-bold">0</span> Stimmen abgegeben (verdeckt)</p>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col justify-center max-w-5xl mx-auto w-full my-1 overflow-hidden min-h-0">
        
        <!-- Voting View -->
        <div id="voting-view" class="flex flex-col h-full justify-between min-h-0">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2 overflow-y-auto p-1 min-h-0" id="player-grid">
                <!-- Injected via JS -->
            </div>

            <div class="h-6 flex items-center justify-center flex-shrink-0 pt-1">
                <div id="quick-feedback" class="text-[11px] font-medium text-amber-400 opacity-0 transition-opacity duration-300 bg-amber-500/10 px-3 py-0.5 rounded-full border border-amber-500/20">
                    ✓ Stimme gezählt! Nächster bitte...
                </div>
            </div>
        </div>

        <!-- Result View -->
        <div id="result-view" class="hidden flex-col h-full justify-center items-center text-center animate-fade-in my-auto">
            <div class="glass-card p-5 md:p-6 rounded-3xl max-w-md w-full border border-zinc-700 shadow-2xl relative overflow-hidden" style="cursor: default;">
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-red-500/10 rounded-full blur-2xl"></div>
                
                <div class="w-14 h-14 bg-amber-500/20 border border-amber-500/40 rounded-2xl flex items-center justify-center mx-auto mb-3 text-amber-400 shadow-inner">
                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.683-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1.001 1.001 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                </div>

                <span class="text-[11px] uppercase tracking-widest text-amber-400 font-bold block mb-1">Spielerin des Spiels</span>
                <h2 id="winner-name" class="text-xl md:text-2xl font-extrabold text-white mb-1">Noch keine Stimmen</h2>
                <div id="winner-stats" class="inline-block px-3 py-1 bg-zinc-800 rounded-full text-zinc-300 text-xs mb-4 border border-zinc-700">
                    0 Stimmen insgesamt
                </div>

                <div class="bg-zinc-900/60 rounded-xl p-3 mb-4 text-left border border-zinc-800">
                    <p class="text-[11px] font-semibold text-zinc-400 mb-1.5 uppercase tracking-wider">Top-Plazierungen</p>
                    <div id="top-three-list" class="space-y-1 text-xs text-zinc-400">
                        Noch keine Daten vorhanden.
                    </div>
                </div>

                <div class="flex gap-3 justify-center">
                    <button onclick="backToVoting()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-red-600/30 transition-all">
                        ← Weiter abstimmen
                    </button>
                    <button onclick="resetVoting()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-semibold rounded-xl border border-zinc-700 transition-all">
                        Neu starten
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-zinc-500 text-[10px] flex-shrink-0 pt-1">
        Zweite Wahl - Beste Wahl • Spieler-Voting-Tool
    </footer>

    <script>
        const players = [
            { id: 1, name: "Lena", number: "15" },
            { id: 2, name: "Vanessa", number: "35" },
            { id: 3, name: "Dana", number: "8" },
            { id: 4, name: "Johanna", number: "25" },
            { id: 5, name: "Annika", number: "65" },
            { id: 6, name: "Floh", number: "22" },
            { id: 7, name: "Anna", number: "66" },
            { id: 8, name: "Annka", number: "13" },
            { id: 9, name: "Hannah", number: "27" },
            { id: 10, name: "Kate", number: "36" },
            { id: 11, name: "Lucy", number: "21" },
            { id: 12, name: "Kerstin", number: "4" },
            { id: 13, name: "Lara", number: "59" },
            { id: 14, name: "Madita", number: "31" },
            { id: 15, name: "Maja", number: "24" },
            { id: 16, name: "MJ", number: "71" },
            { id: 17, name: "Matea", number: "33" },
            { id: 18, name: "Maya", number: "9" },
            { id: 19, name: "Melina", number: "11" },
            { id: 20, name: "Nora", number: "26" },
            { id: 21, name: "Ronja", number: "39" },
            { id: 22, name: "Sara", number: "48" },
            { id: 23, name: "Maxi", number: "5" },
            { id: 24, name: "Lina", number: "–" },
            { id: 25, name: "Jessi", number: "–" }
        ];

        let totalVotesCast = 0;
        let votes = {}; 
        players.forEach(p => votes[p.id] = 0);

        function renderGrid() {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = '';
            players.forEach(p => {
                const card = document.createElement('div');
                card.className = "glass-card p-2.5 rounded-xl flex items-center justify-between";
                
                card.onclick = () => castVote(p.id, card);

                card.innerHTML = `
                    <div class="flex items-center gap-2.5 min-w-0 pointer-events-none w-full">
                        <div class="w-8 h-8 rounded-lg bg-zinc-800 border border-zinc-700 flex items-center justify-center flex-shrink-0 text-amber-400 font-bold text-xs">
                            ${p.number}
                        </div>
                        <div class="min-w-0">
                            <h3 class="font-medium text-xs text-white truncate">${p.name}</h3>
                            <p class="text-[10px] text-zinc-400">Nr. ${p.number}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('total-votes-count').innerText = totalVotesCast;
        }

        function castVote(playerId, cardElement) {
            votes[playerId]++;
            totalVotesCast++;

            cardElement.classList.add('flash-active');
            setTimeout(() => {
                cardElement.classList.remove('flash-active');
            }, 150);

            const feedback = document.getElementById('quick-feedback');
            feedback.style.opacity = '1';
            setTimeout(() => {
                feedback.style.opacity = '0';
            }, 1000);

            document.getElementById('total-votes-count').innerText = totalVotesCast;
        }

        function showResults() {
            document.getElementById('voting-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('main-title').innerText = "Ergebnis der Spieler-Wahl";

            if (totalVotesCast === 0) {
                document.getElementById('winner-name').innerText = "Noch keine Stimmen";
                document.getElementById('winner-stats').innerText = "0 Stimmen insgesamt";
                document.getElementById('top-three-list').innerHTML = "Es wurden noch keine Stimmen abgegeben.";
                return;
            }

            let sorted = [...players].sort((a, b) => votes[b.id] - votes[a.id]);
            let winner = sorted[0];
            let winnerPercentage = Math.round((votes[winner.id] / totalVotesCast) * 100);

            document.getElementById('winner-name').innerText = winner.name;
            document.getElementById('winner-stats').innerText = `Nummer ${winner.number} • ${votes[winner.id]} Stimmen (${winnerPercentage}%)`;

            const topList = document.getElementById('top-three-list');
            topList.innerHTML = '';
            sorted.slice(0, 3).forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between text-zinc-300 py-0.5 text-xs";
                row.innerHTML = `
                    <span class="flex items-center gap-2">
                        <span class="font-bold text-zinc-400">#${idx + 1}</span>
                        <span class="truncate">${p.name} (${p.number})</span>
                    </span>
                    <span class="font-semibold text-amber-400">${votes[p.id]} St.</span>
                `;
                topList.appendChild(row);
            });
        }

        function backToVoting() {
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('voting-view').classList.remove('hidden');
            document.getElementById('main-title').innerText = "Spielerin des Spiels";
        }

        function resetVoting() {
            if (confirm("Wirklich alle Stimmen zurücksetzen?")) {
                totalVotesCast = 0;
                players.forEach(p => votes[p.id] = 0);
                backToVoting();
                renderGrid();
            }
        }

        renderGrid();
    </script>
</body>
</html>
